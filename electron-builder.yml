appId: com.nihilpointzero.os
productName: NIHILPOINTZERO-OS
directories:
  buildResources: resources
  output: release
files:
  - out/**
  - package.json
asarUnpack:
  - "**/node_modules/ffmpeg-static/**"
  - "**/node_modules/ffprobe-static/**"
  - "**/node_modules/pdf-parse/**"
  - "**/node_modules/pdfjs-dist/**"
  - "**/node_modules/onnxruntime-node/**"
extraResources:
  - from: resources/models
    to: models
  - from: resources/audio-pack
    to: audio-pack
win:
  target:
    - portable
    - nsis
  icon: resources/icon.ico
  signExecutable: false
portable:
  artifactName: NIHILPOINTZERO-OS-portable.exe
  requestExecutionLevel: user
nsis:
  artifactName: NIHILPOINTZERO-OS-setup.exe
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
publish:
  provider: github
  owner: DSKJazz
  repo: NihilPointZeroStudio
  releaseType: release
