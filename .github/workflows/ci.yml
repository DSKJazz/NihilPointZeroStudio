name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the tests
        run: npm run test

      - name: Lint
        run: npm run lint

      - name: Typecheck the phone bridge and the phone app
        run: |
          npx tsc -p tsconfig.remote.json --noEmit
          npm run typecheck:phone

      - name: Build the app bundle
        run: npm run build
