name: CI - Windows Build & Test

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build-test:
    name: Build and Test on Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci

      - name: Lint
        shell: pwsh
        run: |
          npm run lint

      - name: Build
        shell: pwsh
        run: |
          npm run build

      - name: Run tests
        shell: pwsh
        run: |
          npm test

      - name: Upload build artifacts (debug)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-debug
          path: |
            out/**
            node_modules/**/electron-updater/**
