name: Build and Release

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write
  actions: write

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test --silent

      - name: Run lint
        run: npm run lint --silent || true

      - name: Build Windows artifacts
        run: npm run dist:win --silent

      - name: Compute checksums
        run: |
          powershell -Command "Get-ChildItem release\* -File | ForEach-Object { Write-Host ($_.FullName); Get-FileHash $_.FullName -Algorithm SHA256 }"

      - name: Create GitHub Release (draft)
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.sha }}
          name: Release for commit ${{ github.sha }}
          body: |-
            Automated build for commit ${{ github.sha }}. Artifacts uploaded as release assets.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
