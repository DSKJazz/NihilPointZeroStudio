name: Dependency update validation

on:
  pull_request:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - name: Install exact lockfile
        run: npm ci
      - name: Validate dependency tree
        run: npm ls --all
      - name: Run high-severity audit gate
        run: npm audit --audit-level=high
      - name: Run application tests
        run: npm test
      - name: Run lint
        run: npm run lint
      - name: Typecheck phone surfaces
        run: npm run typecheck:remote && npm run typecheck:phone
      - name: Build application
        run: npm run build
