name: Ship (Windows)

# Runs the full ship pipeline on a Windows runner
# Triggers: manual dispatch, pull requests to main, and when merged/pushed to main
on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: write
  packages: write
  issues: write

jobs:
  ship:
    name: Run npm run ship on Windows
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      CI: true
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci

      - name: Build, lint and test
        shell: pwsh
        run: |
          npm run lint --if-present
          npm run build --if-present
          npm test --if-present

      - name: Run ship (E2E + packaging + release)
        shell: pwsh
        run: |
          # The ship script performs the E2E smoke gate and will publish release assets.
          # Ensure GH_TOKEN (repo write permissions) is provided in repository secrets.
          npm run ship

      - name: Upload ship logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ship-logs
          path: |
            out/electron-debug.log
            out/release/**
            logs/**

      - name: Success note
        if: success()
        run: echo "Ship workflow completed successfully. Check GitHub Releases and release assets."
        shell: pwsh
